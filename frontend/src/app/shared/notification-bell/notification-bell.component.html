<div class="bell-wrap">
  <button class="bell-btn" (click)="toggle()" aria-label="Notifications">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9" />
      <path d="M13.73 21a2 2 0 0 1-3.46 0" />
    </svg>
    @if (notificationService.unreadCount() > 0) {
      <span class="badge">{{ notificationService.unreadCount() > 9 ? '9+' : notificationService.unreadCount() }}</span>
    }
  </button>

  @if (open()) {
    <div class="backdrop" (click)="close()"></div>
    <div class="dropdown">
      <div class="dropdown-header">
        <h4>Notifications</h4>
        @if (notificationService.unreadCount() > 0) {
          <button class="mark-all" (click)="markAllRead($event)">Mark all read</button>
        }
      </div>

      @if (loading()) {
        <p class="empty-msg">Loading...</p>
      } @else if (notifications().length === 0) {
        <p class="empty-msg">No notifications yet.</p>
      } @else {
        <div class="notif-list">
          @for (n of notifications(); track n._id) {
            <button class="notif-item" [class.unread]="!n.isRead" (click)="select(n)">
              @if (!n.isRead) {
                <span class="dot"></span>
              }
              <div class="notif-body">
                <strong>{{ n.title }}</strong>
                @if (n.message) {
                  <p>{{ n.message }}</p>
                }
                <span class="time">{{ n.createdAt | date: 'short' }}</span>
              </div>
            </button>
          }
        </div>
      }
    </div>
  }
</div>
